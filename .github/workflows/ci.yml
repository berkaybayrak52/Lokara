name: CI

on:
  push:
    branches: [main, feat/py-migration]
  pull_request:

jobs:
  # TS lane — Bun + Turbo (web app + the pre-migration TS backend, still live until parity)
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lokara
          POSTGRES_PASSWORD: lokara
          POSTGRES_DB: lokara
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U lokara -d lokara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lokara:lokara@localhost:54322/lokara
      DIRECT_URL: postgresql://lokara:lokara@localhost:54322/lokara
      SUPABASE_JWT_SECRET: ci-only-secret-not-used-in-prod-123456
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --filter @lokara/db migrate:deploy
      - run: bun run --filter @lokara/pdf install-browser
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  # Python lane — uv workspace (FastAPI backend + engines, built up in Phases B–E)
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.9.2'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest
