name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lokara
          POSTGRES_PASSWORD: lokara
          POSTGRES_DB: lokara
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U lokara -d lokara"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://lokara:lokara@localhost:54322/lokara
      DIRECT_URL: postgresql://lokara:lokara@localhost:54322/lokara
      SUPABASE_JWT_SECRET: ci-only-secret-not-used-in-prod-123456
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lokara/db migrate:deploy
      - run: pnpm --filter @lokara/pdf install-browser
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
