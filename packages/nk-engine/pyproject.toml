[project]
name = "lokara-nk-engine"
version = "0.1.0"
description = "Pure NK allocation engine (skeleton; built in Phase C / M1)"
requires-python = ">=3.12"
dependencies = ["lokara-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_nk_engine"]

[tool.uv.sources]
lokara-domain = { workspace = true }

