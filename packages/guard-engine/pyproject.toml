[project]
name = "lokara-guard-engine"
version = "0.1.0"
description = "Pure shared guard engine for deadlines, meter calibration and UVI cadence"
requires-python = ">=3.12"
dependencies = ["lokara-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_guard_engine"]

[tool.uv.sources]
lokara-domain = { workspace = true }
