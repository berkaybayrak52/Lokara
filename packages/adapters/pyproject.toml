[project]
name = "lokara-adapters"
version = "0.1.0"
description = "External-edge ports as Protocols + fixture stubs (bank, vision, email, meter/MDL, Destatis, DATEV)"
requires-python = ">=3.12"
dependencies = [
  "lokara-domain",
]

[tool.uv.sources]
lokara-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_adapters"]
