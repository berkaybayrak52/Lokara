[project]
name = "lokara-heating-engine"
version = "0.1.0"
description = "Pure heating/CO2 engine (skeleton; built in Phase C / M2)"
requires-python = ">=3.12"
dependencies = ["lokara-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_heating_engine"]

[tool.uv.sources]
lokara-domain = { workspace = true }

