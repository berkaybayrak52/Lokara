[project]
name = "lokara-rules-store"
version = "0.1.0"
description = "Versioned legal rules with as-of law dates (HKVO, CO2 Stufenmodell, degree days)"
requires-python = ">=3.12"
dependencies = ["lokara-domain", "lokara-uvi-engine"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_rules_store"]

[tool.hatch.build.targets.wheel.force-include]
"src/lokara_rules_store/data/plz_geocoord.csv" = "lokara_rules_store/data/plz_geocoord.csv"

[tool.uv.sources]
lokara-domain = { workspace = true }
lokara-uvi-engine = { workspace = true }
