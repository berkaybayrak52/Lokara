[project]
name = "lokara-matching-engine"
version = "0.1.0"
description = "Pure bank-matching engine — scoring, decision, settlement and reversal (docs/15)"
requires-python = ">=3.12"
dependencies = ["lokara-domain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_matching_engine"]

[tool.uv.sources]
lokara-domain = { workspace = true }
