# Root of the uv (Python) workspace — apps/api + the backend/engine packages.
# The TS workspace (apps/web, apps/mobile, packages/ui) is managed by Bun + Turborepo.
# Explicit member list on purpose: packages/ui stays TypeScript-only.
[tool.uv.workspace]
members = [
  "apps/api",
  "packages/domain",
  "packages/nk-engine",
  "packages/heating-engine",
  "packages/rules-store",
  "packages/adapters",
  "packages/db",
  "packages/pdf",
]

# Virtual root: members are pulled in via the dev group so a plain `uv sync`
# installs the whole workspace (editable) + tooling.
[dependency-groups]
dev = [
  "pytest>=8.3",
  "mypy>=1.14",
  "ruff>=0.9",
  "lokara-api",
  "lokara-domain",
  "lokara-nk-engine",
  "lokara-heating-engine",
  "lokara-rules-store",
  "lokara-adapters",
  "lokara-db",
  "lokara-pdf",
  "httpx2>=1.0",
]

[tool.uv.sources]
lokara-api = { workspace = true }
lokara-domain = { workspace = true }
lokara-nk-engine = { workspace = true }
lokara-heating-engine = { workspace = true }
lokara-rules-store = { workspace = true }
lokara-adapters = { workspace = true }
lokara-db = { workspace = true }
lokara-pdf = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff 0.16 formats fenced ```python blocks inside Markdown. The snippets in
# `lokara-arch.md`, `docs/03` and `docs/02` are illustrative prose — some
# are hand-aligned to make a point, and `docs/` is the source of truth CLAUDE.md
# says wins over code. A formatter must not rewrite it as a side effect of a lint
# sweep. Reverse this line if we ever decide doc snippets should be formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# German legal/monetary text is part of the product: NBSP belongs in currency
# strings, × and § in legal-formula comments.
allowed-confusables = [" ", "×", "–"]

[tool.mypy]
strict = true
files = [
  "apps/api/src",
  "apps/api/tests",
  "packages/domain/src",
  "packages/domain/tests",
  "packages/nk-engine/src",
  "packages/nk-engine/tests",
  "packages/heating-engine/src",
  "packages/heating-engine/tests",
  "packages/rules-store/src",
  "packages/rules-store/tests",
  "packages/adapters/src",
  "packages/adapters/tests",
  "packages/db/src",
  "packages/db/tests",
  "packages/pdf/src",
  "packages/pdf/tests",
  "scripts/tests",
]

[tool.pytest.ini_options]
testpaths = [
  "apps/api/tests",
  "packages/domain/tests",
  "packages/nk-engine/tests",
  "packages/heating-engine/tests",
  "packages/rules-store/tests",
  "packages/adapters/tests",
  "packages/db/tests",
  "packages/pdf/tests",
  "scripts/tests",
]
