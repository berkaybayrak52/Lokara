[project]
name = "lokara-api"
version = "0.1.0"
description = "Lokara FastAPI backend — one HTTP/JSON API for web + mobile"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pyjwt>=2.10",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  # multipart/form-data parsing — required by FastAPI for the M4 Beleg upload.
  "python-multipart>=0.0.20",
  "lokara-domain",
  "lokara-db",
  "lokara-nk-engine",
  "lokara-heating-engine",
  "lokara-matching-engine",
  "lokara-rules-store",
  "lokara-adapters",
  "lokara-pdf",
]

[project.scripts]
lokara-api = "lokara_api.main:run"

[tool.uv.sources]
lokara-domain = { workspace = true }
lokara-db = { workspace = true }
lokara-nk-engine = { workspace = true }
lokara-heating-engine = { workspace = true }
lokara-matching-engine = { workspace = true }
lokara-rules-store = { workspace = true }
lokara-adapters = { workspace = true }
lokara-pdf = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lokara_api"]
